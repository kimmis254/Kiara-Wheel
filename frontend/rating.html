<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rate Activities</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../frontend/css/rating.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<header class="navbar">
  <div class="logo">
    <a href="index.html" class="logo-circle"><img src="assets/logo.png" alt="Logo" /></a>
  </div>
  <div class="menu-toggle" id="menu-toggle">&#9776;</div>
  <nav class="nav-links" id="nav-links">
    <a href="index.html">Home</a>
    <a href="create.html">Form</a>
    <a href="index.html#how-it-works">How It Works</a>
    <a href="#">About</a>
  </nav>
</header>

<main class="main-form">
  <section class="intro">
    <h1>Build Your Wheel</h1>
    <p>Rate your activities from 1–10 based on love, skill, demand, and monetization.</p>
  </section>

  <div class="progress-bar"><div class="progress" id="progress"></div></div>

  <section class="activity-card">
    <h2>Activity <span id="activity-count">1</span>: <span id="activity-name"></span></h2>

    <div class="rating-category">
      <div class="icon-label"><i class="fas fa-heart"></i> <span>What you love</span></div>
      <div class="boxes" aria-label="Love rating"></div>
    </div>
    <div class="rating-category">
      <div class="icon-label"><i class="fas fa-brain"></i> <span>What you do well</span></div>
      <div class="boxes" aria-label="Skill rating"></div>
    </div>
    <div class="rating-category">
      <div class="icon-label"><i class="fas fa-dollar-sign"></i> <span>Can people pay for it</span></div>
      <div class="boxes" aria-label="Pay rating"></div>
    </div>
    <div class="rating-category">
      <div class="icon-label"><i class="fas fa-globe"></i> <span>Does the world need it</span></div>
      <div class="boxes" aria-label="World need rating"></div>
    </div>

    <div class="next-activity">
      <button class="next-btn" id="next-btn">Next Activity</button>
    </div>
  </section>
</main>

<footer class="footer-cta">
  <button class="cta-button" id="finish-btn">
    GET YOUR WHEEL <span class="arrow">→</span>
  </button>
  <p class="hint">Your journey to purpose starts here!</p>
</footer>

<script>
  let activities = [];
  let savedRatings = [];
  let currentActivityIndex = 0;
  let sessionId = null;

  document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    sessionId = urlParams.get('sessionId');
    if (!sessionId) return redirectWithError('Missing session ID.');

    try {
      const res = await fetch(`http://localhost:5000/api/session/${sessionId}`);
      if (!res.ok) throw new Error('Session not found.');
      const session = await res.json();
      activities = session.activities || [];
      if (!activities.length) return redirectWithError('No activities in session.');
      loadActivity(currentActivityIndex);
    } catch (err) {
      console.error(err);
      return redirectWithError('Failed to load session.');
    }

    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentActivityIndex < activities.length - 1) {
        currentActivityIndex++;
        loadActivity(currentActivityIndex);
      } else {
        alert('All activities rated. Please click GET YOUR WHEEL.');
      }
    });

    document.getElementById('finish-btn').addEventListener('click', async () => {
      const payload = {
        sessionId,
        activities: activities.map((activity, i) => ({
          name: activity.name,
          love: savedRatings[i]?.love || 0,
          well: savedRatings[i]?.well || 0,
          pay: savedRatings[i]?.pay || 0,
          world: savedRatings[i]?.world || 0
        }))
      };
      console.log('Submitting payload:', payload);
      try {
        const res = await fetch('http://localhost:5000/api/wheel/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          window.location.href = `results.html?sessionId=${sessionId}`;
        } else {
          alert('Error generating your wheel.');
        }
      } catch (err) {
        console.error(err);
        alert('Server error. Try again later.');
      }
    });
  });

  function redirectWithError(msg) {
    alert(msg);
    window.location.href = 'create.html';
  }

  function loadActivity(index) {
    const activity = activities[index];
    if (!activity) return;

    document.getElementById('activity-name').textContent = activity.name;
    document.getElementById('activity-count').textContent = index + 1;
    document.getElementById('progress').style.width = `${((index + 1) / activities.length) * 100}%`;

    ['love', 'well', 'pay', 'world'].forEach((cat, idx) => setupRatingBoxes(cat, idx));
    const currentRatings = savedRatings[index] || {};
    applySavedRatings(currentRatings);
  }

  function setupRatingBoxes(category, index) {
    const group = document.querySelectorAll('.boxes')[index];
    group.innerHTML = '';
    for (let i = 1; i <= 10; i++) {
      const wrapper = document.createElement('div');
      wrapper.classList.add('box-wrapper');
      const box = document.createElement('div');
      box.classList.add('box');
      box.dataset.value = i;
      box.textContent = i;
      box.addEventListener('click', () => handleBoxClick(index, i));
      const label = document.createElement('div');
      label.classList.add('description');
      if (i === 1) label.textContent = 'Least Likely';
      if (i === 10) label.textContent = 'Most Likely';
      wrapper.appendChild(box);
      wrapper.appendChild(label);
      group.appendChild(wrapper);
    }
  }

  function handleBoxClick(categoryIndex, value) {
    const groups = document.querySelectorAll('.boxes')[categoryIndex];
    groups.querySelectorAll('.box').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.value) <= value);
    });

    const current = savedRatings[currentActivityIndex] || { love: 0, well: 0, pay: 0, world: 0 };
    if (categoryIndex === 0) current.love = value;
    if (categoryIndex === 1) current.well = value;
    if (categoryIndex === 2) current.pay = value;
    if (categoryIndex === 3) current.world = value;
    savedRatings[currentActivityIndex] = current;
  }

  function applySavedRatings(ratings) {
    ['love', 'well', 'pay', 'world'].forEach((cat, idx) => {
      const group = document.querySelectorAll('.boxes')[idx];
      const val = ratings[cat];
      if (val) {
        group.querySelectorAll('.box').forEach(b => {
          b.classList.toggle('active', parseInt(b.dataset.value) <= val);
        });
      }
    });
  }
</script>

</body>
</html>
